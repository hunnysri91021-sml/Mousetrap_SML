name = "mousetrap-sml"
main = "src/worker.js"
compatibility_date = "2025-01-01"
keep_vars = true   # ไม่ให้การ deploy ลบตัวแปรที่ตั้งใน Dashboard

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/pub/*", "/login"]

# 1) สร้างฐานข้อมูลใน Dashboard (Storage & Databases > D1) แล้วนำ Database ID มาใส่แทนด้านล่าง
[[d1_databases]]
binding = "DB"
database_name = "mousetrap"
database_id = "48c807a8-c499-46b2-b3cf-21c3c0ed36a7"

# ตัวแปรที่ตั้งใน Dashboard (Settings > Variables and Secrets) ไม่ต้องใส่ในไฟล์นี้:
#   TEAM_DOMAIN, POLICY_AUD, BOOTSTRAP_ADMINS
#   (ไม่บังคับ) RESEND_API_KEY, MAIL_FROM, LINE_TOKEN, LINE_TO
